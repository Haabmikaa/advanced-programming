# ===========================================
# DATABASE CONFIGURATION
# ===========================================

# Database Connection
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3307/quizdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
db.username=quizapp_user
db.password=quizapp_password123

# Connection Pool Settings (Apache DBCP2)
db.pool.initialSize=5
db.pool.maxTotal=20
db.pool.maxIdle=10
db.pool.minIdle=5
db.pool.maxWaitMillis=10000
db.pool.testOnBorrow=true
db.pool.validationQuery=SELECT 1
db.pool.testWhileIdle=true
db.pool.timeBetweenEvictionRunsMillis=30000
db.pool.minEvictableIdleTimeMillis=60000

# Application Database Settings
db.schema=quizdb
db.show_sql=true
db.format_sql=true
db.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JPA/Hibernate Settings
jpa.show_sql=true
jpa.format_sql=true
jpa.use_sql_comments=true
jpa.hibernate.ddl-auto=validate
jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Logging Settings
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===========================================
# APPLICATION DATABASE QUERIES
# ===========================================

# User Queries
query.user.login=SELECT * FROM users WHERE username = ? AND password = ? AND is_active = TRUE
query.user.byId=SELECT * FROM users WHERE user_id = ?
query.user.all=SELECT * FROM users ORDER BY username
query.user.count=SELECT COUNT(*) FROM users

# Quiz Queries
query.quiz.all=SELECT * FROM quizzes WHERE is_published = TRUE ORDER BY created_at DESC
query.quiz.byId=SELECT * FROM quizzes WHERE quiz_id = ?
query.quiz.byCategory=SELECT * FROM quizzes WHERE category = ? AND is_published = TRUE
query.quiz.count=SELECT COUNT(*) FROM quizzes

# Question Queries
query.question.byQuiz=SELECT * FROM questions WHERE quiz_id = ? ORDER BY question_id
query.question.count=SELECT COUNT(*) FROM questions

# Result Queries
query.result.byUser=SELECT * FROM results WHERE user_id = ? ORDER BY submitted_at DESC
query.result.byQuiz=SELECT * FROM results WHERE quiz_id = ? ORDER BY percentage DESC